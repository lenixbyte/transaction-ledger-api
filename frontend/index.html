<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transaction Ledger</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --ok:#15803d; --bad:#b91c1c; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header nav { display:flex; gap:14px; align-items:center; font-size:14px; }
  header a { color:var(--accent); text-decoration:none; }
  main { max-width:1000px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns:minmax(0, 1fr); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; min-width:0; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  form { display:grid; gap:8px; }
  input, select, button { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:#fff; min-width:0; }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
  button.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
  button.link { background:none; color:var(--accent); padding:0; border:none; }
  button:disabled { opacity:.5; cursor:default; }
  .muted { color:var(--muted); font-size:13px; }
  code { word-break:break-all; font-size:13px; }
  .balance { font-size:30px; font-weight:600; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .row > * { flex:1; min-width:110px; }
  .grid2 { display:grid; gap:16px; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 760px) { .grid2 { grid-template-columns:minmax(0, 1fr); } }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  .tabs button { flex:1; }
  .auth { max-width:420px; width:100%; margin:24px auto 0; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .credit { color:var(--ok); } .debit { color:var(--bad); }
  .scroll { overflow-x:auto; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); padding:10px 14px; border-radius:8px; color:#fff; display:none; max-width:90vw; z-index:9; }
</style>
</head>
<body>
<header>
  <h1>Transaction Ledger</h1>
  <nav>
    <a id="docs-link" href="#">API docs</a>
    <span id="who" class="muted" hidden></span>
    <button class="secondary" id="logout" hidden>Log out</button>
  </nav>
</header>

<main id="auth-view" hidden>
  <section class="card auth">
    <div class="tabs">
      <button id="tab-login">Log in</button>
      <button id="tab-signup" class="secondary">Create account</button>
    </div>
    <form id="auth-form">
      <input name="name" placeholder="Full name" maxlength="100" autocomplete="name" hidden>
      <input name="username" placeholder="Username" required minlength="3" maxlength="50" autocomplete="username">
      <input name="password" type="password" placeholder="Password (8+ characters)" required minlength="8" autocomplete="current-password">
      <button id="auth-submit">Log in</button>
    </form>
    <p class="muted" id="auth-hint">New here? Create an account. It starts with a balance of 0.</p>
  </section>
</main>

<main id="app-view" hidden>
  <section class="card">
    <div class="muted">Balance</div>
    <div class="balance" id="balance">–</div>
    <div class="muted">My account ID (share it to receive transfers): <code id="my-id"></code>
      <button class="link" id="copy-id">Copy</button></div>
  </section>

  <div class="grid2">
    <section class="card">
      <h2>Add transaction</h2>
      <form id="tx-form">
        <div class="row">
          <select name="type"><option value="credit">Credit</option><option value="debit">Debit</option></select>
          <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
        </div>
        <input name="description" placeholder="Description (optional)" maxlength="255">
        <input name="reference_id" placeholder="Reference ID (unique per account)" required maxlength="100">
        <button>Submit</button>
      </form>
    </section>
    <section class="card">
      <h2>Send money</h2>
      <form id="transfer-form">
        <input name="to_account_id" placeholder="Recipient's account ID" required maxlength="64">
        <input name="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required>
        <input name="description" placeholder="Description (optional)" maxlength="255">
        <input name="reference_id" placeholder="Reference ID" required maxlength="100">
        <button>Send</button>
      </form>
    </section>
  </div>

  <section class="card">
    <div class="row" style="margin-bottom:8px">
      <h2 style="margin:0">History</h2>
      <select id="filter"><option value="">All</option><option value="credit">Credits</option><option value="debit">Debits</option></select>
      <select id="limit"><option>5</option><option selected>10</option><option>20</option><option>50</option></select>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>When</th><th>Type</th><th>Description</th><th>Reference</th><th class="num">Amount</th><th class="num">Balance</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="secondary" id="prev">← Prev</button>
      <span class="muted" id="pageinfo" style="text-align:center"></span>
      <button class="secondary" id="next">Next →</button>
    </div>
  </section>
</main>
<div id="toast"></div>

<script src="config.js"></script>
<script>
const API = window.API_BASE.replace(/\/$/, "");
const $ = (s) => document.querySelector(s);
document.getElementById("docs-link").href = window.DOCS_URL || `${API}/docs`;
const money = (n) => n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const state = { token: localStorage.getItem("ledger_token"), mode: "login", page: 1 };

function toast(msg, ok = true) {
  const t = $("#toast");
  t.textContent = msg; t.style.background = ok ? "var(--ok)" : "var(--bad)"; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), 4000);
}

async function api(path, opts = {}) {
  const headers = { "content-type": "application/json" };
  if (state.token) headers.Authorization = `Bearer ${state.token}`;
  const res = await fetch(API + path, { ...opts, headers });
  if (res.status === 204) return null;
  const body = await res.json().catch(() => ({}));
  if (res.status === 401 && state.token) { setToken(null); render(); }
  if (!res.ok) {
    const e = body.error || {};
    const extra = Array.isArray(e.details) ? ": " + e.details.map((d) => `${d.field ?? ""} ${d.message}`).join(", ") : "";
    throw new Error(`${e.message || "Request failed"}${extra}`);
  }
  return body;
}

const formJSON = (form) => Object.fromEntries([...new FormData(form)].filter(([, v]) => v !== ""));
const setToken = (t) => { state.token = t; t ? localStorage.setItem("ledger_token", t) : localStorage.removeItem("ledger_token"); };

function setMode(mode) {
  state.mode = mode;
  const signup = mode === "signup";
  $("#tab-login").className = signup ? "secondary" : "";
  $("#tab-signup").className = signup ? "" : "secondary";
  const name = $("#auth-form [name=name]");
  name.hidden = !signup; name.required = signup;
  $("#auth-form [name=password]").autocomplete = signup ? "new-password" : "current-password";
  $("#auth-submit").textContent = signup ? "Create account" : "Log in";
}

async function render() {
  const authed = Boolean(state.token);
  $("#auth-view").hidden = authed;
  $("#app-view").hidden = !authed;
  $("#logout").hidden = !authed;
  $("#who").hidden = !authed;
  if (!authed) return;
  const me = await api("/me");
  $("#who").textContent = `${me.name} (@${me.username})`;
  $("#my-id").textContent = me.id;
  $("#balance").textContent = money(me.balance);
  await loadHistory();
}

async function loadHistory() {
  const q = new URLSearchParams({ page: state.page, limit: $("#limit").value });
  if ($("#filter").value) q.set("type", $("#filter").value);
  const { data, pagination: p } = await api(`/me/transactions?${q}`);
  $("#rows").innerHTML = data.map((t) => `<tr>
      <td>${new Date(t.created_at).toLocaleString()}</td>
      <td class="${t.type}">${t.type}${t.transfer_id ? " ⇄" : ""}</td>
      <td>${esc(t.description)}</td>
      <td class="muted">${esc(t.transfer_id ? "transfer" : t.reference_id)}</td>
      <td class="num ${t.type}">${t.type === "debit" ? "−" : "+"}${money(t.amount)}</td>
      <td class="num">${money(t.balance_after)}</td></tr>`).join("")
    || `<tr><td colspan="6" class="muted">No transactions yet.</td></tr>`;
  $("#pageinfo").textContent = `Page ${p.page} of ${p.total_pages || 1} · ${p.total_records} total`;
  $("#prev").disabled = p.page <= 1;
  $("#next").disabled = p.page >= p.total_pages;
}

const refresh = () => { state.page = 1; return render(); };
const run = (fn) => fn().catch((err) => toast(err.message, false));

$("#tab-login").addEventListener("click", () => setMode("login"));
$("#tab-signup").addEventListener("click", () => setMode("signup"));

$("#auth-form").addEventListener("submit", (e) => {
  e.preventDefault();
  run(async () => {
    const body = formJSON(e.target);
    if (state.mode === "login") delete body.name;
    const res = await api(`/auth/${state.mode}`, { method: "POST", body: JSON.stringify(body) });
    setToken(res.access_token); e.target.reset(); await refresh();
    toast(state.mode === "signup" ? "Account created" : "Welcome back");
  });
});

$("#logout").addEventListener("click", () => run(async () => {
  await api("/auth/logout", { method: "POST" }).catch(() => {});
  setToken(null); setMode("login"); await render();
}));

$("#copy-id").addEventListener("click", () => run(async () => {
  await navigator.clipboard.writeText($("#my-id").textContent); toast("Account ID copied");
}));

$("#tx-form").addEventListener("submit", (e) => {
  e.preventDefault();
  run(async () => {
    const body = formJSON(e.target); body.amount = Number(body.amount);
    await api("/me/transactions", { method: "POST", body: JSON.stringify(body) });
    e.target.reset(); await refresh(); toast("Transaction recorded");
  });
});

$("#transfer-form").addEventListener("submit", (e) => {
  e.preventDefault();
  run(async () => {
    const body = formJSON(e.target); body.amount = Number(body.amount);
    await api("/me/transfers", { method: "POST", body: JSON.stringify(body) });
    e.target.reset(); await refresh(); toast("Money sent");
  });
});

$("#filter").addEventListener("change", () => { state.page = 1; run(loadHistory); });
$("#limit").addEventListener("change", () => { state.page = 1; run(loadHistory); });
$("#prev").addEventListener("click", () => { state.page--; run(loadHistory); });
$("#next").addEventListener("click", () => { state.page++; run(loadHistory); });

setMode("login");
run(render);
</script>
</body>
</html>
